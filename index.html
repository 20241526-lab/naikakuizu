<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歴代総理大臣当てゲーム</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f4f8; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 520px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button, select { font-size: 16px; padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .result { font-weight: bold; margin-top: 15px; font-size: 18px; }
        .hidden { display: none; }
        .mode-desc { font-size: 13px; color: #444; margin-top: 10px; text-align: left; background: #eef2f7; padding: 12px; border-radius: 6px; line-height: 1.5; }
        .wrong-list { margin-top: 20px; text-align: left; background: #fff5f5; padding: 15px; border-radius: 8px; border: 1px solid #feb2b2; max-height: 250px; overflow-y: auto; }
        .wrong-list h3 { margin-top: 0; color: #c53030; font-size: 16px; margin-bottom: 10px; }
        .wrong-list ul { margin: 0; padding-left: 20px; font-size: 14px; }
        .wrong-list li { margin-bottom: 6px; color: #2d3748; line-height: 1.4; }
        .timer-display { font-size: 20px; font-weight: bold; color: #d9534f; margin-bottom: 10px; font-family: monospace; }
        .option-group { margin-top: 15px; text-align: left; background: #fafafa; padding: 10px 15px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .gameover-text { color: #dc3545; font-size: 24px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h1>歴代総理大臣当てゲーム</h1>

    <div id="setup-screen">
        <p><strong>① 出題範囲（1〜103代）</strong></p>
        <label><input type="number" id="start-num" value="1" min="1" max="103"> 代目 〜 </label>
        <label><input type="number" id="end-num" value="103" min="1" max="103"> 代目</label>

        <p style="margin-top:20px;"><strong>② 難易度を選択</strong></p>
        <select id="difficulty" onchange="updateDesc()">
            <option value="easy">かんたん（苗字・ひらがなOK）</option>
            <option value="hard">むずかしい（苗字OK ＋ 就任回数）</option>
            <option value="extreme">激ムズ（漢字フルネーム ＋ 就任回数）</option>
            <option value="oni">鬼ムズ（サドンデス！ノーヒント＋漢字フルネーム＋就任回数）</option>
        </select>

        <div class="option-group">
            <label style="cursor:pointer;">
                <input type="checkbox" id="timer-toggle" checked> <strong>ストップウォッチ機能（計測する）</strong>
            </label>
        </div>
        
        <div class="mode-desc" id="mode-desc-text">
            ・第7代（伊藤博文の4回目就任）の例：<br>
            「伊藤」「いとう」「伊藤博文」などで正解
        </div>

        <br>
        <button onclick="startGame()">ゲームスタート</button>
    </div>

    <div id="game-screen" class="hidden">
        <div id="timer-box" class="timer-display hidden">⏱ 00:00</div>
        <h2 id="question">第?代の内閣総理大臣は？</h2>
        <p id="sub-hint">漢字またはひらがな（フルネーム/苗字のみ可）で入力してください</p>
        <div id="input-container">
            <input type="text" id="answer-input" placeholder="名前を入力..." onkeydown="if(event.key==='Enter') checkAnswer()">
            <button onclick="checkAnswer()">回答</button>
        </div>
        <div id="result-message" class="result"></div>
        <p id="progress-text">進行状況: <span id="current-count">0</span> / <span id="total-questions">0</span> 題（正解: <span id="score">0</span>）</p>

        <div id="wrong-summary" class="wrong-list hidden">
            <h3>❌ 間違えた問題と正解</h3>
            <ul id="wrong-ul"></ul>
        </div>

        <button onclick="resetGame()" style="background-color: #6c757d; margin-top: 15px;">範囲を選び直す</button>
    </div>
</div>

function normalizeNumber(str) {
    const numMap = {
        '①': '1', '②': '2', '③': '3', '④': '4', '⑤': '5',
        '一': '1', '二': '2', '三': '3', '四': '4', '五': '5',
        '１': '1', '２': '2', '３': '3', '４': '4', '５': '5'
    };
    return str.replace(/[①②③④⑤一二三四五１２３４５]/g, m => numMap[m] || m);
}

function updateDesc() {
    const diff = document.getElementById('difficulty').value;
    const descBox = document.getElementById('mode-desc-text');
    if (diff === "easy") {
        descBox.innerHTML = "・第7代（伊藤博文の4回目就任）の例：<br>「伊藤」「いとう」「伊藤博文」などで正解";
    } else if (diff === "hard") {
        descBox.innerHTML = "・第7代（伊藤博文の4回目就任）の例：<br>「伊藤4」「いとう④」「伊藤博文四」などで正解";
    } else if (diff === "extreme") {
        descBox.innerHTML = "・第7代（伊藤博文の4回目就任）の例：<br>「伊藤博文4」「伊藤博文④」で正解（※ひらがなや苗字のみは不可）";
    } else if (diff === "oni") {
        descBox.innerHTML = "・鬼ムズ（サドンデス！1問間違いで即ゲームオーバー）：<br>「伊藤博文4」「伊藤博文④」で正解（※ノーヒント）";
    }
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function startTimer() {
    secondsElapsed = 0;
    updateTimerDisplay();
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        secondsElapsed++;
        updateTimerDisplay();
    }, 1000);
}

function stopTimer() {
    if (timerInterval) clearInterval(timerInterval);
}

function updateTimerDisplay() {
    const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
    const secs = (secondsElapsed % 60).toString().padStart(2, '0');
    document.getElementById('timer-box').innerText = `⏱ ${mins}:${secs}`;
}

function startGame() {
    const start = parseInt(document.getElementById('start-num').value);
    const end = parseInt(document.getElementById('end-num').value);
    selectedDifficulty = document.getElementById('difficulty').value;
    isTimerEnabled = document.getElementById('timer-toggle').checked;

    if (isNaN(start) || isNaN(end) || start > end || start < 1 || end > 103) {
        alert("正しい範囲を入力してください（1〜103）");
        return;
    }

    questionPool = [];
    for (let i = start; i <= end; i++) {
        if (pmMasterData[i]) {
            questionPool.push({ number: i, ...pmMasterData[i] });
        }
    }

    if (questionPool.length === 0) {
        alert("指定された範囲のデータが見つかりません");
        return;
    }

    shuffle(questionPool);

    currentIndex = 0;
    score = 0;
    wrongAnswers = [];

    document.getElementById('wrong-summary').classList.add('hidden');
    document.getElementById('wrong-ul').innerHTML = "";
    document.getElementById('input-container').style.display = "block";
    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    document.getElementById('total-questions').innerText = questionPool.length;

    if (isTimerEnabled) {
        document.getElementById('timer-box').classList.remove('hidden');
        startTimer();
    } else {
        document.getElementById('timer-box').classList.add('hidden');
    }

    if (selectedDifficulty === "oni") {
        document.getElementById('sub-hint').innerText = "【鬼ムズ】1問でも間違えたら即終了！「漢字フルネーム ＋ 就任回数」を入力（例: 伊藤博文4）";
    } else if (selectedDifficulty === "extreme") {
        document.getElementById('sub-hint').innerText = "【激ムズ】漢字フルネーム ＋ 就任回数 を入力してください（例: 伊藤博文4、伊藤博文④）";
    } else if (selectedDifficulty === "hard") {
        document.getElementById('sub-hint').innerText = "【むずかしい】名前 ＋ 就任回数 を入力してください（例: 伊藤4、いとう④）";
    } else {
        document.getElementById('sub-hint').innerText = "【かんたん】漢字またはひらがな（フルネーム/苗字のみ可）で入力してください";
    }

    showQuestion();
}

function showQuestion() {
    if (currentIndex >= questionPool.length) {
        finishGame(false);
        return;
    }

    const q = questionPool[currentIndex];

    if (selectedDifficulty === "oni") {
        document.getElementById('question').innerText = `第 ??? 代の内閣総理大臣は？`;
    } else {
        document.getElementById('question').innerText = `第 ${q.number} 代の内閣総理大臣は？`;
    }

    document.getElementById('answer-input').value = "";
    document.getElementById('result-message').innerText = "";
    document.getElementById('current-count').innerText = currentIndex + 1;
    document.getElementById('score').innerText = score;
    document.getElementById('answer-input').focus();
}

function checkAnswer() {
    const rawInput = document.getElementById('answer-input').value.trim();
    const q = questionPool[currentIndex];

    if (!rawInput) return;

    let isCorrect = false;

    if (selectedDifficulty === "easy") {
        isCorrect = (rawInput === q.name || rawInput === q.kana || (q.aliases && q.aliases.includes(rawInput)));
    } else if (selectedDifficulty === "hard") {
        const normalizedInput = normalizeNumber(rawInput);
        const correctPatterns = [
            `${q.name}${q.times}`,
            `${q.kana}${q.times}`
        ];
        if (q.aliases) {
            q.aliases.forEach(alias => correctPatterns.push(`${alias}${q.times}`));
        }
        isCorrect = correctPatterns.includes(normalizedInput);
    } else if (selectedDifficulty === "extreme" || selectedDifficulty === "oni") {
        const normalizedInput = normalizeNumber(rawInput);
        let allowedNames = [q.name];
        if (q.aliases) {
            q.aliases.forEach(a => {
                if (!/^[ぁ-ん]+$/.test(a) && a.length > 2) {
                    allowedNames.push(a);
                }
            });
        }
        const extremeCorrectPatterns = allowedNames.map(n => `${n}${q.times}`);
        isCorrect = extremeCorrectPatterns.includes(normalizedInput);
    }

    if (isCorrect) {
        document.getElementById('result-message').style.color = "green";
        document.getElementById('result-message').innerText = `⭕️ 正解！ (第${q.number}代 ${q.name}・第${q.times}回目就任)`;
        score++;
        document.getElementById('score').innerText = score;
        currentIndex++;
        setTimeout(showQuestion, 1800);
    } else {
        document.getElementById('result-message').style.color = "red";
        document.getElementById('result-message').innerText = `❌ 残念！ 正解は 第${q.number}代「${q.name}」（第${q.times}回目）でした`;
        wrongAnswers.push({
            number: q.number,
            name: q.name,
            kana: q.kana,
            times: q.times,
            userAns: rawInput
        });

        // 鬼ムズ（サドンデス）の場合は即時終了処理へ
        if (selectedDifficulty === "oni") {
            setTimeout(() => {
                finishGame(true);
            }, 1800);
        } else {
            currentIndex++;
            setTimeout(showQuestion, 1800);
        }
    }
}

function finishGame(isSuddenDeath) {
    stopTimer();
    document.getElementById('input-container').style.display = "none";
    document.getElementById('sub-hint').innerText = "";

    if (isSuddenDeath) {
        document.getElementById('question').innerHTML = "<span class='gameover-text'>💀 GAME OVER（強制終了）</span>";
    } else {
        document.getElementById('question').innerText = "全問終了！お疲れ様でした！";
    }

    let resultText = `最終結果: ${questionPool.length}問中 ${score}問正解！`;
    if (isTimerEnabled) {
        const mins = Math.floor(secondsElapsed / 60);
        const secs = secondsElapsed % 60;
        resultText += `\n⏱ クリアタイム: ${mins}分${secs}秒`;
    }
    document.getElementById('result-message').innerText = resultText;

    if (wrongAnswers.length > 0) {
        document.getElementById('wrong-summary').classList.remove('hidden');
        const ul = document.getElementById('wrong-ul');
        ul.innerHTML = "";
        
        wrongAnswers.sort((a, b) => a.number - b.number);
        
        wrongAnswers.forEach(item => {
            const li = document.createElement('li');
            let answerText = `${item.name}（${item.kana}）`;
            if (selectedDifficulty === "hard" || selectedDifficulty === "extreme" || selectedDifficulty === "oni") {
                answerText = `${item.name}${item.times}`;
            }
            li.innerHTML = `<strong>第${item.number}代:</strong> 正解「${answerText}」 <span style="color:#718096; font-size:12px;">(あなたの入力: ${item.userAns})</span>`;
            ul.appendChild(li);
        });
    } else {
        document.getElementById('result-message').innerText += "\n🎉 全問正解です！素晴らしい！";
    }
}

function resetGame() {
    stopTimer();
    document.getElementById('setup-screen').classList.remove('hidden');
    document.getElementById('game-screen').classList.add('hidden');
    document.getElementById('input-container').style.display = "block";
    document.getElementById('wrong-summary').classList.add('hidden');
    document.getElementById('timer-box').classList.add('hidden');
}
</script>
