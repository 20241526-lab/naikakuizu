<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歴代総理大臣当てゲーム</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      width: 100%;
      max-width: 600px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #2c3e50;
    }
    .settings, .game-screen, .result-screen {
      display: none;
    }
    .active {
      display: block;
    }
    .option-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .option-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }
    .checkbox-group label {
      font-weight: normal;
      cursor: pointer;
    }
    button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
      width: 100%;
    }
    button:hover {
      background-color: #2980b9;
    }
    .info-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-weight: bold;
      background: #eef2f5;
      padding: 10px 15px;
      border-radius: 6px;
    }
    .card {
      background: #fafafa;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .pm-display {
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 2px;
      margin: 15px 0;
      color: #2c3e50;
    }
    .hint-box {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      color: #856404;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      text-align: left;
      font-size: 14px;
    }
    .message {
      margin-top: 10px;
      font-weight: bold;
      height: 24px;
    }
    .correct { color: #27ae60; }
    .incorrect { color: #e74c3c; }
  </style>
</head>
<body>

  <div class="container">
    <h1>歴代総理大臣当てゲーム</h1>

    <!-- 設定画面 -->
    <div id="setup-screen" class="settings active">
      <div class="option-group">
        <label for="difficulty">難易度を選択:</label>
        <select id="difficulty">
          <option value="easy">かんたん（代数と苗字のヒントあり）</option>
          <option value="normal">むずかしい（代数のみ表示）</option>
          <option value="hard">激ムズ（代数表示なし、就任代数の数字必須）</option>
          <option value="sudden_death">鬼ムズ（激ムズ ＋ 1問ミスで即ゲームオーバー）</option>
        </select>
      </div>

      <div class="checkbox-group">
        <label><input type="checkbox" id="opt-stopwatch"> ストップウォッチを表示</label>
        <label><input type="checkbox" id="opt-time-attack"> タイムアタックモード（1問10秒制限）</label>
        <label><input type="checkbox" id="opt-hint" checked> ヒント表示（時代・主な出来事）</label>
      </div>

      <button id="start-btn">ゲームスタート</button>
    </div>

    <!-- ゲームプレイ画面 -->
    <div id="game-screen" class="game-screen">
      <div class="info-bar">
        <span id="question-num">第 1 問</span>
        <span id="timer-display">経過時間: 0秒</span>
      </div>

      <div class="card">
        <div id="pm-info" class="pm-display">第1代 総理大臣</div>
        
        <div id="hint-area" class="hint-box">
          <div><strong>時代:</strong> <span id="hint-era">-</span></div>
          <div><strong>主な出来事:</strong> <span id="hint-event">-</span></div>
        </div>

        <input type="text" id="answer-input" placeholder="名前（例: 伊藤博文 または 伊藤博文1）" autocomplete="off">
        <button id="submit-btn">回答する</button>
        <div id="feedback-msg" class="message"></div>
      </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="result-screen">
      <h2 id="result-title">ゲーム終了！</h2>
      <p id="result-score" style="margin: 20px 0; font-size: 18px;"></p>
      <button id="retry-btn">もう一度プレイ</button>
    </div>
  </div>

  <script>
    // 歴代総理大臣データセット
    const pmData = [
      { id: 1, name: "伊藤博文1", era: "明治", event: "大日本帝国憲法発布" },
      { id: 2, name: "黒田清隆", era: "明治", event: "超然主義演説" },
      { id: 3, name: "山縣有朋1", era: "明治", event: "第一回衆議院議員総選挙" },
      { id: 4, name: "松方正義1", era: "明治", event: "地租軽減問題" },
      { id: 5, name: "伊藤博文2", era: "明治", event: "日清戦争" },
      { id: 6, name: "松方正義2", era: "明治", event: "金本位制確立" },
      { id: 7, name: "伊藤博文3", era: "明治", event: "隈板内閣発足前の政局調整" },
      { id: 8, name: "大隈重信1", era: "明治", event: "初の政党内閣（隈板内閣）" },
      { id: 9, name: "山縣有朋2", era: "明治", event: "治安警察法制定" },
      { id: 10, name: "伊藤博文4", era: "明治", event: "立憲政友会結成" },
      { id: 11, name: "桂太郎1", era: "明治", event: "日露戦争、日英同盟" },
      { id: 12, name: "西園寺公望1", era: "明治", event: "桂園時代開幕" },
      { id: 13, name: "桂太郎2", era: "明治", event: "韓国併合" },
      { id: 14, name: "西園寺公望2", era: "明治", event: "大正デモクラシーの始まり" },
      { id: 15, name: "桂太郎3", era: "大正", event: "大正政変" },
      { id: 16, name: "山本権兵衛1", era: "大正", event: "シーメンス事件" },
      { id: 17, name: "大隈重信2", era: "大正", event: "第一次世界大戦参戦、対華21カ条要求" },
      { id: 18, name: "寺内正毅", era: "大正", event: "米騒動" },
      { id: 19, name: "原敬", era: "大正", event: "初の本格的政党内閣（平民宰相）" },
      { id: 20, name: "高橋是清", era: "大正", event: "ワシントン軍縮会議" },
      { id: 21, name: "加藤友三郎", era: "大正", event: "山東出兵撤兵" },
      { id: 22, name: "山本権兵衛2", era: "大正", event: "関東大震災" },
      { id: 23, name: "清浦奎吾", era: "大正", event: "第二次護憲運動" },
      { id: 24, name: "加藤高明", era: "大正", event: "普通選挙法・治安維持法制定" },
      { id: 25, name: "若槻禮次郎1", era: "昭和", event: "金融恐慌" },
      { id: 26, name: "田中義一", era: "昭和", event: "山東出兵、張作霖爆殺事件" },
      { id: 27, name: "濱口雄幸", era: "昭和", event: "ロンドン海軍軍縮条約" },
      { id: 28, name: "若槻禮次郎2", era: "昭和", event: "満州事変勃発" },
      { id: 29, name: "犬養毅", era: "昭和", event: "五・一五事件" },
      { id: 30, name: "斎藤実", era: "昭和", event: "国際連盟脱退" }
    ];

    // ゲーム状態変数
    let currentQuizIndex = 0;
    let score = 0;
    let timerInterval = null;
    let totalSeconds = 0;
    let timeAttackSeconds = 10;
    let selectedMode = 'easy';
    let isStopwatchOn = false;
    let isTimeAttackOn = false;
    let isHintOn = true;

    // DOM要素
    const setupScreen = document.getElementById('setup-screen');
    const gameScreen = document.getElementById('game-screen');
    const resultScreen = document.getElementById('result-screen');
    const startBtn = document.getElementById('start-btn');
    const submitBtn = document.getElementById('submit-btn');
    const retryBtn = document.getElementById('retry-btn');
    const answerInput = document.getElementById('answer-input');
    const feedbackMsg = document.getElementById('feedback-msg');
    const timerDisplay = document.getElementById('timer-display');

    // イベントリスナー
    startBtn.addEventListener('click', startGame);
    submitBtn.addEventListener('click', handleAnswer);
    retryBtn.addEventListener('click', resetGame);
    answerInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleAnswer();
    });

    // ゲーム開始
    function startGame() {
      selectedMode = document.getElementById('difficulty').value;
      isStopwatchOn = document.getElementById('opt-stopwatch').checked;
      isTimeAttackOn = document.getElementById('opt-time-attack').checked;
      isHintOn = document.getElementById('opt-hint').checked;

      setupScreen.classList.remove('active');
      gameScreen.classList.add('active');

      currentQuizIndex = 0;
      score = 0;
      totalSeconds = 0;

      // ヒント枠の表示・非表示
      document.getElementById('hint-area').style.display = isHintOn ? 'block' : 'none';

      // タイマー開始
      if (isStopwatchOn || isTimeAttackOn) {
        startTimer();
      } else {
        timerDisplay.style.display = 'none';
      }

      loadQuestion();
    }

    // 問題読み込み
    function loadQuestion() {
      if (currentQuizIndex >= pmData.length) {
        endGame(true);
        return;
      }

      const current = pmData[currentQuizIndex];
      document.getElementById('question-num').textContent = `第 ${currentQuizIndex + 1} 問 / 全 ${pmData.length} 問`;

      // 難易度別の問題表示
      const pmInfo = document.getElementById('pm-info');
      if (selectedMode === 'easy') {
        const familyName = current.name.replace(/[0-9]/g, '').substring(0, 2); // 簡略的に苗字
        pmInfo.textContent = `第${current.id}代 (${familyName}...)`;
      } else if (selectedMode === 'normal') {
        pmInfo.textContent = `第${current.id}代 総理大臣`;
      } else { // hard, sudden_death
        pmInfo.textContent = `第${current.id}代`;
      }

      // ヒント更新
      if (isHintOn) {
        document.getElementById('hint-era').textContent = current.era;
        document.getElementById('hint-event').textContent = current.event;
      }

      answerInput.value = '';
      feedbackMsg.textContent = '';
      answerInput.focus();

      if (isTimeAttackOn) {
        timeAttackSeconds = 10;
        updateTimerDisplay();
      }
    }

    // ★核心ロジック: 回答照合（就任1回目は数字なしでも正解扱い）★
    function checkAnswer(input, correctAnswer) {
      const cleanInput = input.trim();

      // 1. 完全一致（例: 「伊藤博文1」と入力）
      if (cleanInput === correctAnswer) {
        return true;
      }

      // 2. 正解が「〇〇1」のように末尾に「1」がついている場合
      if (correctAnswer.endsWith('1')) {
        const nameWithoutOne = correctAnswer.slice(0, -1);
        // 末尾の「1」を除いた名前（例: 「伊藤博文」）での入力も正解とする
        if (cleanInput === nameWithoutOne) {
          return true;
        }
      }

      return false;
    }

    // 回答処理
    function handleAnswer() {
      const userInput = answerInput.value;
      const current = pmData[currentQuizIndex];

      if (!userInput.trim()) return;

      if (checkAnswer(userInput, current.name)) {
        score++;
        feedbackMsg.textContent = '正解！';
        feedbackMsg.className = 'message correct';
        currentQuizIndex++;
        setTimeout(loadQuestion, 800);
      } else {
        feedbackMsg.textContent = `不正解！ 正解は「${current.name}」`;
        feedbackMsg.className = 'message incorrect';

        // 鬼ムズ（サドンデス）の場合は1問ミスで即ゲームオーバー
        if (selectedMode === 'sudden_death') {
          setTimeout(() => endGame(false), 1200);
          return;
        }

        currentQuizIndex++;
        setTimeout(loadQuestion, 1200);
      }
    }

    // タイマー管理
    function startTimer() {
      clearInterval(timerInterval);
      timerDisplay.style.display = 'inline';

      timerInterval = setInterval(() => {
        totalSeconds++;

        if (isTimeAttackOn) {
          timeAttackSeconds--;
          if (timeAttackSeconds <= 0) {
            feedbackMsg.textContent = '時間切れ！';
            feedbackMsg.className = 'message incorrect';
            
            if (selectedMode === 'sudden_death') {
              clearInterval(timerInterval);
              setTimeout(() => endGame(false), 1000);
              return;
            }

            currentQuizIndex++;
            setTimeout(loadQuestion, 1000);
          }
        }

        updateTimerDisplay();
      }, 1000);
    }

    function updateTimerDisplay() {
      if (isTimeAttackOn) {
        timerDisplay.textContent = `残り時間: ${timeAttackSeconds}秒`;
      } else if (isStopwatchOn) {
        timerDisplay.textContent = `経過時間: ${totalSeconds}秒`;
      }
    }

    // ゲーム終了
    function endGame(isCompleted) {
      clearInterval(timerInterval);
      gameScreen.classList.remove('active');
      resultScreen.classList.add('active');

      const title = document.getElementById('result-title');
      const scoreDisplay = document.getElementById('result-score');

      if (!isCompleted && selectedMode === 'sudden_death') {
        title.textContent = 'ゲームオーバー（サドンデス）';
      } else {
        title.textContent = 'クリア！お疲れ様でした！';
      }

      let timeText = isStopwatchOn ? `<br>クリアタイム: ${totalSeconds}秒` : '';
      scoreDisplay.innerHTML = `正解数: ${score} / ${currentQuizIndex} 問${timeText}`;
    }

    // リセット
    function resetGame() {
      resultScreen.classList.remove('active');
      setupScreen.classList.add('active');
    }
  </script>
</body>
</html>
