<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歴代総理大臣当てゲーム</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f4f8; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 520px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button, select { font-size: 16px; padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .result { font-weight: bold; margin-top: 15px; font-size: 18px; }
        .hidden { display: none; }
        .mode-desc { font-size: 13px; color: #444; margin-top: 10px; text-align: left; background: #eef2f7; padding: 12px; border-radius: 6px; line-height: 1.5; }
        .wrong-list { margin-top: 20px; text-align: left; background: #fff5f5; padding: 15px; border-radius: 8px; border: 1px solid #feb2b2; max-height: 250px; overflow-y: auto; }
        .wrong-list h3 { margin-top: 0; color: #c53030; font-size: 16px; margin-bottom: 10px; }
        .wrong-list ul { margin: 0; padding-left: 20px; font-size: 14px; }
        .wrong-list li { margin-bottom: 6px; color: #2d3748; line-height: 1.4; }
        .timer-display { font-size: 20px; font-weight: bold; color: #d9534f; margin-bottom: 10px; font-family: monospace; }
        .option-group { margin-top: 15px; text-align: left; background: #fafafa; padding: 10px 15px; border-radius: 6px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 8px; }
        
        .hint-container { margin: 10px 0; }
        .hint-btn { background-color: #ffc107; color: #212529; font-size: 14px; padding: 6px 14px; border-radius: 20px; font-weight: bold; }
        .hint-btn:hover { background-color: #e0a800; }
        .hint-box { background: #fff3cd; border: 1px solid #ffeeba; color: #856404; padding: 10px; border-radius: 6px; margin-top: 8px; font-weight: bold; line-height: 1.4; }
        
        .gauge-container {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 10px;
            height: 16px;
            overflow: hidden;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
        }
        .gauge-bar {
            height: 100%;
            width: 100%;
            background-color: #28a745;
            transition: width 0.1s linear, background-color 0.3s ease;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>歴代総理大臣当てゲーム</h1>

    <div id="setup-screen">
        <p><strong>① 出題範囲（1〜103代）</strong></p>
        <label><input type="number" id="start-num" value="1" min="1" max="103"> 代目 〜 </label>
        <label><input type="number" id="end-num" value="103" min="1" max="103"> 代目</label>

        <p style="margin-top:20px;"><strong>② 難易度を選択</strong></p>
        <select id="difficulty" onchange="updateDesc()">
            <option value="easy">かんたん（苗字・ひらがなOK）</option>
            <option value="hard">むずかしい（苗字OK ＋ 就任回数）</option>
            <option value="extreme">激ムズ（出来事から回答 ＋ フルネーム・就任回数）</option>
        </select>

        <div class="option-group">
            <label style="cursor:pointer;">
                <input type="checkbox" id="hint-toggle" checked> <strong>ヒント機能を表示する</strong>
            </label>
            <label style="cursor:pointer;">
                <input type="checkbox" id="timer-toggle" checked> <strong>ストップウォッチ機能（タイム計測）</strong>
            </label>
            <label>
                <strong>タイムアタック機能（1問の制限時間）:</strong><br>
                <select id="time-attack-select" style="width: 100%; margin-top: 5px;">
                    <option value="0">なし（時間制限なし）</option>
                    <option value="10">1問 10秒</option>
                    <option value="15">1問 15秒</option>
                </select>
            </label>
            <label style="cursor:pointer; color: #c53030;">
                <input type="checkbox" id="sudden-death-toggle"> <strong>サドンデス機能（1問ミスで即ゲームオーバー）</strong>
            </label>
        </div>
        
        <div class="mode-desc" id="mode-desc-text">
            ・第1代（伊藤博文の1回目就任）の例：<br>
            「伊藤」「いとう」「伊藤博文」などで正解
        </div>

        <br>
        <button onclick="startGame()">ゲームスタート</button>
    </div>

    <div id="game-screen" class="hidden">
        <div id="timer-box" class="timer-display hidden">⏱ 00:00</div>
        
        <div id="gauge-box" class="gauge-container hidden">
            <div id="gauge-bar" class="gauge-bar"></div>
        </div>

        <h2 id="question">第?代の内閣総理大臣は？</h2>
        
        <div id="hint-container" class="hint-container hidden">
            <button class="hint-btn" onclick="toggleHint()">💡 ヒントを見る</button>
            <div id="hint-box" class="hint-box hidden"><span id="hint-text">-</span></div>
        </div>

        <p id="sub-hint">漢字またはひらがな（フルネーム/苗字のみ可）で入力してください</p>
        
        <div id="input-container">
            <input type="text" id="answer-input" placeholder="名前を入力..." onkeydown="if(event.key==='Enter') checkAnswer()">
            <button onclick="checkAnswer()">回答</button>
        </div>
        <div id="result-message" class="result"></div>
        <p>進行状況: <span id="current-count">0</span> / <span id="total-questions">0</span> 題（正解: <span id="score">0</span>）</p>

        <div id="wrong-summary" class="wrong-list hidden">
            <h3>❌ 間違えた問題と正解</h3>
            <ul id="wrong-ul"></ul>
        </div>

        <button id="reset-btn" onclick="resetGame()" style="background-color: #6c757d; margin-top: 15px;">範囲を選び直す</button>
    </div>
</div>

let questionPool = [];
let currentIndex = 0;
let score = 0;
let selectedDifficulty = "easy";
let isSuddenDeath = false;
let wrongAnswers = [];
let timerInterval = null;
let secondsElapsed = 0;
let isTimerEnabled = true;

let timeAttackLimit = 0;
let countdownInterval = null;
let startTime = 0;

let isHintEnabled = true;

function normalizeNumber(str) {
    const numMap = {
        '①': '1', '②': '2', '③': '3', '④': '4', '⑤': '5',
        '一': '1', '二': '2', '三': '3', '四': '4', '五': '5',
        '１': '1', '２': '2', '３': '3', '４': '4', '５': '5'
    };
    return str.replace(/[①②③④⑤一二三四五１２３４５]/g, m => numMap[m] || m);
}

function updateDesc() {
    const diff = document.getElementById('difficulty').value;
    const descBox = document.getElementById('mode-desc-text');
    if (diff === "easy") {
        descBox.innerHTML = "・第1代（伊藤博文の1回目就任）の例：<br>「伊藤」「いとう」「伊藤博文」などで正解";
    } else if (diff === "hard") {
        descBox.innerHTML = "・第1代（伊藤博文の1回目就任）の例：<br>「伊藤」「伊藤1」「いとう」などで正解（※1回目は「1」省略可）";
    } else if (diff === "extreme") {
        descBox.innerHTML = "・第1代（伊藤博文の1回目就任）の例：<br>問題文が出来事になり、回答は「伊藤博文」「伊藤博文1」となります。";
    }
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function startTimer() {
    secondsElapsed = 0;
    updateTimerDisplay();
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        secondsElapsed++;
        updateTimerDisplay();
    }, 1000);
}

function stopTimer() {
    if (timerInterval) clearInterval(timerInterval);
    if (countdownInterval) clearInterval(countdownInterval);
}

function updateTimerDisplay() {
    const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
    const secs = (secondsElapsed % 60).toString().padStart(2, '0');
    document.getElementById('timer-box').innerText = `⏱ ${mins}:${secs}`;
}

function startGaugeCountdown() {
    if (timeAttackLimit <= 0) return;
    
    const gaugeBox = document.getElementById('gauge-box');
    const gaugeBar = document.getElementById('gauge-bar');
    gaugeBox.classList.remove('hidden');
    
    gaugeBar.style.width = '100%';
    gaugeBar.style.backgroundColor = '#28a745';
    
    startTime = Date.now();
    const durationMs = timeAttackLimit * 1000;
    
    if (countdownInterval) clearInterval(countdownInterval);
    
    countdownInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const remainingRatio = Math.max(0, (durationMs - elapsed) / durationMs);
        
        gaugeBar.style.width = `${remainingRatio * 100}%`;
        
        if (remainingRatio <= 0.2) {
            gaugeBar.style.backgroundColor = '#dc3545';
        } else if (remainingRatio <= 0.5) {
            gaugeBar.style.backgroundColor = '#ffc107';
        }

        if (remainingRatio <= 0) {
            clearInterval(countdownInterval);
            handleTimeUp();
        }
    }, 100);
}

function handleTimeUp() {
    const q = questionPool[currentIndex];
    document.getElementById('result-message').style.color = "#dc3545";
    
    let ansDisp = q.name;
    if (selectedDifficulty !== "easy") {
        ansDisp = q.times === 1 ? `${q.name}（または${q.name}1）` : `${q.name}${q.times}`;
    }
    document.getElementById('result-message').innerText = `⏰ 時間切れ... (正解: ${ansDisp})`;
    
    wrongAnswers.push({
        number: q.number,
        name: q.name,
        kana: q.kana,
        times: q.times,
        userAns: "（時間切れ）"
    });

    if (isSuddenDeath) {
        setTimeout(() => endGame(false), 1500);
    } else {
        currentIndex++;
        setTimeout(showQuestion, 1200);
    }
}

function toggleHint() {
    const hintBox = document.getElementById('hint-box');
    hintBox.classList.toggle('hidden');
}

function startGame() {
    const start = parseInt(document.getElementById('start-num').value);
    const end = parseInt(document.getElementById('end-num').value);
    selectedDifficulty = document.getElementById('difficulty').value;
    isSuddenDeath = document.getElementById('sudden-death-toggle').checked;
    isTimerEnabled = document.getElementById('timer-toggle').checked;
    timeAttackLimit = parseInt(document.getElementById('time-attack-select').value);
    isHintEnabled = document.getElementById('hint-toggle').checked;

    if (isNaN(start) || isNaN(end) || start > end || start < 1 || end > 103) {
        alert("正しい範囲を入力してください（1〜103）");
        return;
    }

    questionPool = [];
    for (let i = start; i <= end; i++) {
        if (pmMasterData[i]) {
            questionPool.push({ number: i, ...pmMasterData[i] });
        }
    }

    if (questionPool.length === 0) {
        alert("指定された範囲のデータが見つかりません");
        return;
    }

    shuffle(questionPool);

    currentIndex = 0;
    score = 0;
    wrongAnswers = [];

    document.getElementById('wrong-summary').classList.add('hidden');
    document.getElementById('wrong-ul').innerHTML = "";
    document.getElementById('input-container').style.display = "block";
    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    document.getElementById('total-questions').innerText = questionPool.length;

    if (isTimerEnabled) {
        document.getElementById('timer-box').classList.remove('hidden');
        startTimer();
    } else {
        document.getElementById('timer-box').classList.add('hidden');
    }

    let modeTitle = "";
    if (selectedDifficulty === "extreme") {
        modeTitle = "【激ムズ】出来事から首相を推測（漢字フルネーム＋就任回数）";
    } else if (selectedDifficulty === "hard") {
        modeTitle = "【むずかしい】名前（＋就任回数）を入力（1回目は数字なし可）";
    } else {
        modeTitle = "【かんたん】漢字またはひらがな（フルネーム/苗字のみ可）で入力";
    }
    
    if (isSuddenDeath) {
        modeTitle += " ※サドンデス（1問ミスで終了）";
    }
    
    document.getElementById('sub-hint').innerText = modeTitle;

    showQuestion();
}

function showQuestion() {
    if (currentIndex >= questionPool.length) {
        endGame(true);
        return;
    }

    const q = questionPool[currentIndex];

    if (selectedDifficulty === "extreme") {
        document.getElementById('question').innerText = q.event;
    } else {
        document.getElementById('question').innerText = `第 ${q.number} 代の内閣総理大臣は？`;
    }

    const hintContainer = document.getElementById('hint-container');
    const hintBox = document.getElementById('hint-box');
    
    if (isHintEnabled) {
        hintContainer.classList.remove('hidden');
        hintBox.classList.add('hidden');
        
        if (selectedDifficulty === "extreme") {
            document.getElementById('hint-text').innerText = `第 ${q.number} 代目の内閣総理大臣`;
        } else {
            document.getElementById('hint-text').innerText = q.event;
        }
    } else {
        hintContainer.classList.add('hidden');
    }

    document.getElementById('answer-input').value = "";
    document.getElementById('result-message').innerText = "";
    document.getElementById('current-count').innerText = currentIndex + 1;
    document.getElementById('score').innerText = score;
    document.getElementById('answer-input').focus();

    if (timeAttackLimit > 0) {
        startGaugeCountdown();
    } else {
        document.getElementById('gauge-box').classList.add('hidden');
    }
}

function checkAnswer() {
    if (countdownInterval) clearInterval(countdownInterval);

    const rawInput = document.getElementById('answer-input').value.trim();
    const q = questionPool[currentIndex];

    if (!rawInput) return;

    let isCorrect = false;

    if (selectedDifficulty === "easy") {
        let allowed = [q.name, q.kana];
        if (q.aliases) allowed = allowed.concat(q.aliases);
        if (q.times === 1) {
            allowed = allowed.concat(allowed.map(item => `${item}1`));
        }
        isCorrect = allowed.includes(rawInput);
    } else if (selectedDifficulty === "hard") {
        const normalizedInput = normalizeNumber(rawInput);
        const correctPatterns = [
            `${q.name}${q.times}`,
            `${q.kana}${q.times}`
        ];
        if (q.aliases) {
            q.aliases.forEach(alias => correctPatterns.push(`${alias}${q.times}`));
        }

        if (q.times === 1) {
            correctPatterns.push(q.name, q.kana);
            if (q.aliases) {
                q.aliases.forEach(alias => correctPatterns.push(alias));
            }
        }

        isCorrect = correctPatterns.includes(normalizedInput);
    } else if (selectedDifficulty === "extreme") {
        const normalizedInput = normalizeNumber(rawInput);
        let allowedNames = [q.name];
        if (q.aliases) {
            q.aliases.forEach(a => {
                if (!/^[ぁ-ん]+$/.test(a) && a.length > 2) {
                    allowedNames.push(a);
                }
            });
        }
        const extremeCorrectPatterns = allowedNames.map(n => `${n}${q.times}`);

        if (q.times === 1) {
            allowedNames.forEach(n => extremeCorrectPatterns.push(n));
        }

        isCorrect = extremeCorrectPatterns.includes(normalizedInput);
    }

    if (isCorrect) {
        score++;
        document.getElementById('result-message').style.color = "#28a745";
        document.getElementById('result-message').innerText = "⭕ 正解！";
        currentIndex++;
        setTimeout(showQuestion, 1200);
    } else {
        document.getElementById('result-message').style.color = "#dc3545";
        let ansDisp = q.name;
        if (selectedDifficulty !== "easy") {
            ansDisp = q.times === 1 ? `${q.name}（または${q.name}1）` : `${q.name}${q.times}`;
        }
        document.getElementById('result-message').innerText = `❌ 不正解... (正解: ${ansDisp})`;
        wrongAnswers.push({
            number: q.number,
            name: q.name,
            kana: q.kana,
            times: q.times,
            userAns: rawInput
        });

        if (isSuddenDeath) {
            setTimeout(() => endGame(false), 1500);
        } else {
            currentIndex++;
            setTimeout(showQuestion, 1200);
        }
    }
}

function endGame(isClear) {
    stopTimer();
    document.getElementById('input-container').style.display = "none";
    document.getElementById('sub-hint').innerText = "";
    document.getElementById('hint-container').classList.add('hidden');
    document.getElementById('gauge-box').classList.add('hidden');

    if (isClear) {
        document.getElementById('question').innerText = "全問終了！お疲れ様でした！";
    } else {
        document.getElementById('question').innerText = "💀 ゲームオーバー！（サドンデス）";
    }

    let resultText = `最終結果: ${questionPool.length}問中 ${score}問正解！`;
    if (isTimerEnabled) {
        const mins = Math.floor(secondsElapsed / 60);
        const secs = secondsElapsed % 60;
        resultText += `\n⏱ クリアタイム: ${mins}分${secs}秒`;
    }
    document.getElementById('result-message').innerText = resultText;

    if (wrongAnswers.length > 0) {
        document.getElementById('wrong-summary').classList.remove('hidden');
        const ul = document.getElementById('wrong-ul');
        ul.innerHTML = "";
        
        wrongAnswers.sort((a, b) => a.number - b.number);
        
        wrongAnswers.forEach(item => {
            const li = document.createElement('li');
            let answerText = `${item.name}（${item.kana}）`;
            if (selectedDifficulty === "hard" || selectedDifficulty === "extreme") {
                answerText = item.times === 1 ? `${item.name}（または ${item.name}1）` : `${item.name}${item.times}`;
            }
            li.innerHTML = `<strong>第${item.number}代:</strong> 正解「${answerText}」 <span style="color:#718096; font-size:12px;">(あなたの入力: ${item.userAns})</span>`;
            ul.appendChild(li);
        });
    } else if (isClear) {
        document.getElementById('result-message').innerText += "\n🎉 全問正解です！素晴らしい！";
    }
}

function resetGame() {
    stopTimer();
    document.getElementById('game-screen').classList.add('hidden');
    document.getElementById('setup-screen').classList.remove('hidden');
}
