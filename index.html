      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .range-inputs {

      align-items: center;
      gap: 10px;
    }
    .range-inputs input {
      margin-bottom: 0;
    }
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }
    .checkbox-group label {

      cursor: pointer;
    }

      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
      width: 100%;
      margin-bottom: 10px;

    }
    button.secondary {

    }

    }

      justify-content: space-between;

      font-weight: bold;
      background: #eef2f5;
      padding: 10px 15px;

    }

      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;

      letter-spacing: 1px;

      color: #2c3e50;
    }

      color: #2980b9;
      margin-bottom: 15px;
      font-weight: bold;
    }

      border: 1px solid #ffeeba;
      color: #856404;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      text-align: left;
      font-size: 14px;

    }

  <div class="container">
    <h1>歴代総理大臣当てゲーム</h1>

    <!-- 設定画面 -->
    <div id="setup-screen" class="settings active">
      <div class="option-group">
        <label for="difficulty">難易度を選択:</label>
        <select id="difficulty">
          <option value="easy">かんたん（代数と歴史的トピックを表示）</option>
          <option value="normal">むずかしい（代数のみ表示）</option>
          <option value="hard">激ムズ（代数表示なし、就任代数の数字必須）</option>
          <option value="sudden_death">鬼ムズ（激ムズ ＋ 1問ミスで即ゲームオーバー）</option>
        </select>
      </div>

      <!-- 出題範囲設定 -->
      <div class="option-group">
        <label>出題範囲（1代〜104代）:</label>
        <div class="range-inputs">
          <input type="number" id="range-start" min="1" max="104" placeholder="1">
          <span>〜</span>
          <input type="number" id="range-end" min="1" max="104" placeholder="104">
        </div>
      </div>

      <div class="checkbox-group">
        <label><input type="checkbox" id="opt-stopwatch"> ストップウォッチを表示</label>
        <label><input type="checkbox" id="opt-time-attack"> タイムアタックモード（1問10秒制限）</label>
        <label><input type="checkbox" id="opt-hint" checked> 詳細ヒント表示（時代・主な出来事）</label>
      </div>

      <button id="start-btn">ゲームスタート</button>
    </div>

    <!-- ゲームプレイ画面 -->
    <div id="game-screen" class="game-screen">
      <div class="info-bar">
        <span id="question-num">第 1 問</span>
        <span id="timer-display">経過時間: 0秒</span>
      </div>

      <div class="card">
        <div id="pm-info" class="pm-display">第1代 総理大臣</div>
        <div id="pm-subtopic" class="pm-subtopic"></div>
        
        <div id="hint-area" class="hint-box">
          <div><strong>時代:</strong> <span id="hint-era">-</span></div>
          <div><strong>特徴・歴史的トピック:</strong> <span id="hint-topic">-</span></div>
          <div><strong>主な出来事:</strong> <span id="hint-event">-</span></div>
        </div>

        <input type="text" id="answer-input" placeholder="名前（例: 伊藤博文 または 伊藤博文1）" autocomplete="off">
        <button id="submit-btn">回答する</button>
        <div id="feedback-msg" class="message"></div>
      </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="result-screen">
      <h2 id="result-title">ゲーム終了！</h2>
      <p id="result-score" style="margin: 20px 0; font-size: 18px;"></p>
      <button id="retry-btn">もう一度プレイ（同じ範囲）</button>
      <button id="change-range-btn" class="secondary">出題範囲・設定を選び直す</button>
    </div>
  </div>

      { id: 92, name: "麻生太郎", era: "平成", topic: "世界金融危機（リーマンショック）に対処", event: "定額給付金の支給" },
      { id: 93, name: "鳩山由紀夫", era: "平成", topic: "民主党への本格的政権交代を達成", event: "事業仕分けの実施" },
      { id: 94, name: "菅直人", era: "平成", topic: "市民運動家出身の首相", event: "東日本大震災・原発事故対応" },
      { id: 95, name: "野田佳彦", era: "平成", topic: "「どじょうすくい」の演説で話題", event: "消費税増税法案の可決" },
      { id: 96, name: "安倍晋三2", era: "平成", topic: "自民党の政権奪還・アベノミクス推進", event: "2020東京五輪誘致成功" },
      { id: 97, name: "安倍晋三3", era: "平成", topic: "安全保障法制の整備を推進", event: "平和安全法制成立" },
      { id: 98, name: "安倍晋三4", era: "平成・令和", topic: "憲政史上最長在任期間を記録", event: "令和への改元・消費税10%増" },
      { id: 99, name: "菅義偉", era: "令和", topic: "「令和おじさん」・叩き上げの首相", event: "デジタル庁発足・東京五輪開催" },
      { id: 100, name: "岸田文雄1", era: "令和", topic: "「新しい資本主義」を掲げる", event: "第100代節目の内閣総理大臣" },
      { id: 101, name: "岸田文雄2", era: "令和", topic: "防衛力の抜本的強化方針を打ち出す", event: "G7広島サミット開催" },
      { id: 102, name: "石破茂1", era: "令和", topic: "自民党総裁選を勝ち抜き首相就任", event: "第102代内閣総理大臣就任" },
      { id: 103, name: "石破茂2", era: "令和", topic: "衆議院解散・総選挙を経て再指名", event: "第103代内閣総理大臣就任" },
      { id: 104, name: "石破茂3", era: "令和", topic: "第104代内閣総理大臣", event: "現行政権の運営" }
    ];

    // 出題用データ配列
    let activePmData = [];

    // ゲーム状態変数
    let currentQuizIndex = 0;
    let score = 0;
    let timerInterval = null;
    let totalSeconds = 0;
    let timeAttackSeconds = 10;
    let selectedMode = 'easy';
    let isStopwatchOn = false;
    let isTimeAttackOn = false;
    let isHintOn = true;

    // DOM要素
    const setupScreen = document.getElementById('setup-screen');
    const gameScreen = document.getElementById('game-screen');
    const resultScreen = document.getElementById('result-screen');
    const startBtn = document.getElementById('start-btn');
    const submitBtn = document.getElementById('submit-btn');
    const retryBtn = document.getElementById('retry-btn');
    const changeRangeBtn = document.getElementById('change-range-btn');
    const answerInput = document.getElementById('answer-input');
    const feedbackMsg = document.getElementById('feedback-msg');
    const timerDisplay = document.getElementById('timer-display');

    // イベントリスナー
    startBtn.addEventListener('click', startGame);
    submitBtn.addEventListener('click', handleAnswer);
    retryBtn.addEventListener('click', () => startGame()); // 同じ設定で再スタート
    changeRangeBtn.addEventListener('click', resetGame); // 設定画面に戻る
    answerInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleAnswer();
    });

    // 範囲フィルター処理
    function filterPmData() {
      const minId = pmData[0].id;
      const maxId = pmData[pmData.length - 1].id;

      let startInput = parseInt(document.getElementById('range-start').value, 10);
      let endInput = parseInt(document.getElementById('range-end').value, 10);

      if (isNaN(startInput) || startInput < minId) startInput = minId;
      if (isNaN(endInput) || endInput > maxId) endInput = maxId;

      if (startInput > endInput) {
        const temp = startInput;
        startInput = endInput;
        endInput = temp;
      }

      activePmData = pmData.filter(pm => pm.id >= startInput && pm.id <= endInput);
    }

    // ゲーム開始
    function startGame() {
      filterPmData();

      if (activePmData.length === 0) {
        alert("該当する範囲のデータがありません。");
        return;
      }

      selectedMode = document.getElementById('difficulty').value;
      isStopwatchOn = document.getElementById('opt-stopwatch').checked;
      isTimeAttackOn = document.getElementById('opt-time-attack').checked;
      isHintOn = document.getElementById('opt-hint').checked;

      setupScreen.classList.remove('active');
      resultScreen.classList.remove('active');
      gameScreen.classList.add('active');

      currentQuizIndex = 0;
      score = 0;
      totalSeconds = 0;

      document.getElementById('hint-area').style.display = isHintOn ? 'block' : 'none';

      if (isStopwatchOn || isTimeAttackOn) {
        startTimer();
      } else {
        timerDisplay.style.display = 'none';
      }

      loadQuestion();
    }

    // 問題読み込み
    function loadQuestion() {
      if (currentQuizIndex >= activePmData.length) {
        endGame(true);
        return;
      }

      const current = activePmData[currentQuizIndex];
      document.getElementById('question-num').textContent = `第 ${currentQuizIndex + 1} 問 / 全 ${activePmData.length} 問`;

      const pmInfo = document.getElementById('pm-info');
      const pmSubtopic = document.getElementById('pm-subtopic');

      if (selectedMode === 'easy') {
        pmInfo.textContent = `第${current.id}代`;
        pmSubtopic.textContent = `【トピック】${current.topic}`;
      } else if (selectedMode === 'normal') {
        pmInfo.textContent = `第${current.id}代 総理大臣`;
        pmSubtopic.textContent = '';
      } else { // hard, sudden_death
        pmInfo.textContent = `第${current.id}代`;
        pmSubtopic.textContent = '';
      }

      if (isHintOn) {
        document.getElementById('hint-era').textContent = current.era;
        document.getElementById('hint-topic').textContent = current.topic;
        document.getElementById('hint-event').textContent = current.event;
      }

      answerInput.value = '';
      feedbackMsg.textContent = '';
      answerInput.focus();

      if (isTimeAttackOn) {
        timeAttackSeconds = 10;
        updateTimerDisplay();
      }
    }

    // 回答照合（就任1回目は数字なしでも正解扱い）
    function checkAnswer(input, correctAnswer) {
      const cleanInput = input.trim();

      if (cleanInput === correctAnswer) {
        return true;
      }

      if (correctAnswer.endsWith('1')) {
        const nameWithoutOne = correctAnswer.slice(0, -1);
        if (cleanInput === nameWithoutOne) {
          return true;
        }
      }

      return false;
    }

    // 回答処理
    function handleAnswer() {
      const userInput = answerInput.value;
      const current = activePmData[currentQuizIndex];

      if (!userInput.trim()) return;

      if (checkAnswer(userInput, current.name)) {
        score++;
        feedbackMsg.textContent = '正解！';
        feedbackMsg.className = 'message correct';
        currentQuizIndex++;
        setTimeout(loadQuestion, 800);
      } else {
        feedbackMsg.textContent = `不正解！ 正解は「${current.name}」`;
        feedbackMsg.className = 'message incorrect';

        if (selectedMode === 'sudden_death') {
          setTimeout(() => endGame(false), 1200);
          return;
        }

        currentQuizIndex++;
        setTimeout(loadQuestion, 1200);
      }
    }

    // タイマー管理
    function startTimer() {
      clearInterval(timerInterval);
      timerDisplay.style.display = 'inline';

      timerInterval = setInterval(() => {
        totalSeconds++;

        if (isTimeAttackOn) {
          timeAttackSeconds--;
          if (timeAttackSeconds <= 0) {
            feedbackMsg.textContent = '時間切れ！';
            feedbackMsg.className = 'message incorrect';
            
            if (selectedMode === 'sudden_death') {
              clearInterval(timerInterval);
              setTimeout(() => endGame(false), 1000);
              return;
            }

            currentQuizIndex++;
            setTimeout(loadQuestion, 1000);
          }
        }

        updateTimerDisplay();
      }, 1000);
    }

    function updateTimerDisplay() {
      if (isTimeAttackOn) {
        timerDisplay.textContent = `残り時間: ${timeAttackSeconds}秒`;
      } else if (isStopwatchOn) {
        timerDisplay.textContent = `経過時間: ${totalSeconds}秒`;
      }
    }

    // ゲーム終了
    function endGame(isCompleted) {
      clearInterval(timerInterval);
      gameScreen.classList.remove('active');
      resultScreen.classList.add('active');

      const title = document.getElementById('result-title');
      const scoreDisplay = document.getElementById('result-score');

      if (!isCompleted && selectedMode === 'sudden_death') {
        title.textContent = 'ゲームオーバー（サドンデス）';
      } else {
        title.textContent = 'クリア！お疲れ様でした！';
      }

      let timeText = isStopwatchOn ? `<br>クリアタイム: ${totalSeconds}秒` : '';
      scoreDisplay.innerHTML = `正解数: ${score} / ${currentQuizIndex} 問${timeText}`;
    }

    // 設定画面へリセット
    function resetGame() {
      resultScreen.classList.remove('active');
      setupScreen.classList.add('active');
    }
  </script>
</body>
